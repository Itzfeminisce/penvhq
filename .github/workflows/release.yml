name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node must be >=22.13 BEFORE pnpm runs — pnpm 11.3 imports node:sqlite.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4 # reads packageManager from package.json

      # Re-run setup-node now that pnpm is on PATH, to enable the pnpm cache
      # and write the npm auth .npmrc for publishing.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Opens a "Version Packages" PR when changesets exist; publishes the
      # scoped @penvhq/* packages to npm when that PR is merged. publish-pinned
      # sends the engine out first, reads the integrity npm recorded, and only
      # then builds and publishes the launcher — so the pin is true by
      # construction, and a version-PR run never touches the committed dev pin.
      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm exec changeset version
          publish: pnpm release:pinned
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # pnpm 11 stopped reading `npm_config_*` and publishes natively rather
          # than through the npm CLI, so `NPM_CONFIG_PROVENANCE` was read by
          # nobody: every @penvhq/* release shipped unattested while the trust
          # model's official tier rested on the attestation. changesets forwards
          # no provenance flag either, so the env var is the only way to reach it.
          PNPM_CONFIG_PROVENANCE: "true"

      # The registry must hold the same bytes the launcher pinned, or every
      # install of that pin fails its integrity check. Silence here would ship it.
      - name: Verify the published engine pin
        if: steps.changesets.outputs.published == 'true'
        run: node --experimental-strip-types scripts/engine-pin.ts verify
